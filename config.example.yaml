server:
  host: 0.0.0.0
  port: 10086          # 端口范围 0-65535；按需改成 10008 / 8080 等

auth:
  # 共享 Token。调用方式：
  #   curl -H "Authorization: Bearer <token>" http://IP:10086/n/ci -d "构建失败"
  #   curl "http://IP:10086/n/ci?token=<token>" -d "构建失败"
  # WebSocket:   ws://IP:100086/ws?token=<token>
  token: "change-me-please"
  allow_query_token: true
  # 可选：来源 IP 白名单（支持 CIDR）
  ip_allow: []

limits:
  per_source_per_minute: 60
  per_target_per_minute: 30
  per_target_per_day: 1000

dedup:
  # 同 (source, level, title) 在窗口内只发一次，压掉告警风暴
  enabled: true
  window_seconds: 60

dispatch:
  sync_timeout: 5.0
  poll_interval: 0.5
  concurrency: 8
  retry_base: 2.0
  retry_max: 300.0
  max_attempts: 5

ingest:
  # WebSocket 上行 / SSE 订阅的接入控制
  max_ws_clients: 64        # 全局并发 WS 连接上限（0 = 不限）
  max_ws_per_source: 8      # 同一 source 的 WS 连接上限（0 = 不限），超限关闭码 4429
  ws_keepalive: 20.0        # 服务端心跳间隔秒：空闲超此时长发 {"type":"ping"}（0 = 关闭）
  ws_send_timeout: 10.0     # 给单个 WS 客户端回包的超时秒，超时断开该客户端
  sse_keepalive: 15.0       # SSE 注释心跳间隔秒
  sse_buffer: 256           # 每个订阅者的队列长度，满则丢消息不阻塞网关

qq:
  app_id: ""
  client_secret: ""
  api_base: "https://api.bot.qq.com"

targets:
  # --- QQ 群机器人（发消息是纯 HTTP，不需要维持 WebSocket）---
  - id: qq:default
    type: qq
    group_openid: "REPLACE_WITH_YOUR_GROUP_OPENID"   # 群场景
    # user_openid: ""         # 单聊场景，二选一
    # channel_id: ""          # 频道场景（官方要求 WS 在线）
    msg_type: 0               # 0=文本 2=Markdown
    # template: "{{ title }}\n{{ body }}"
    rate_per_minute: 25

  # --- 通用 Webhook（企微 / 钉钉 / 飞书 / TG / 任意 URL）---
  - id: hook:example
    type: webhook
    url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx"
    method: POST
    # 非 JSON 模板会以 {"msgtype":"text","text":{"content": ...}} 提交
    # template: '{"msgtype":"text","text":{"content":"{{ title }}: {{ body }}"}'
    rate_per_minute: 20

  # --- 出站 WebSocket 连接池 ---
  - id: ws:napcat
    type: ws
    url: "ws://127.0.0.1:3001"
    pool: 2                     # 同时维持 2 条连接，round-robin 分配
    ack_timeout: 5.0            # 0 表示不等回执（发完就算成功）
    ping_interval: 30.0
    reconnect_base: 1.0
    reconnect_max: 60.0
    template: '{"action":"send_group_msg","params":{"group_id":1,"message":"{{ title }}: {{ body }}"}}'
    # ping_payload: '{"action":"ping","echo":"hb"}'   # OneBot 之类可配
    # enabled: false

routes:
  # 按顺序匹配，第一条命中即生效；务必把 source:"*" 放最后兜底
  - source: ci                 # 匹配 X-Source 头声明的来源
    level: [error, warn]
    targets: [qq:default]

  - source: ["*"]              # 兜底
    targets: [qq:default, hook:example]

# 插件清单（noti_gateway/plugins/ 下的模块名），顺序即事件分发顺序：
# qqws 独占 QQ 长连接并广播事件流，chatdownload 归档在前，命令类插件在后
plugins: ["qqws", "chatdownload", "reminders", "webchat"]

# QQ 官方网关长连接插件（qqws）：全进程唯一的收消息入口，收到事件广播给其他插件
qqws:
  enabled: true              # chatdownload.enabled=true 时必须开启（事件流来源）
  bot: ""                    # 连接用哪台机器人（bots[].id）；留空回落 chatdownload.bot >
                             # 第一个带凭据的 bot > 旧式全局 qq 段

# 私聊消息归档插件（chatdownload）：订阅 qqws 的事件流，白名单用户单聊实时落盘
# 归档布局：<data_dir>/chat.txt（全部文本）+ media/（图片/文件）+
#           events.jsonl（原始事件流水，先落盘后下载，防丢账本）+ error.jsonl（下载失败记录）
# 硬限制：QQ 开放平台无历史消息接口，离线期间消息永久丢失
chatdownload:
  enabled: false
  data_dir: "quest"          # 归档目录（相对运行目录）
  target_users: []           # user_openid 白名单；空 = 归档全部单聊
  download_concurrency: 2    # 图片/文件并发下载数

# 定时提醒插件（reminders）：一次性/每天/每周(多天)/工作日/周末/每月/每年/间隔/cron
# 双入口：HTTP POST /schedule + QQ 发指令「#提醒 <时间> <内容>」（详见 README 对应章节）
reminders:
  enabled: true
  source: remind             # 提醒投递/回复用的 source（走 routes 路由扇出）
  grace_seconds: 900         # 错过补发窗口：停机跨过触发点，重启后窗口内补发并注明原定时间
  tick_seconds: 1.0          # 调度扫描间隔秒
  max_list: 20               # 「提醒 列表」最多展示条数

# WebChat 网页消息面板插件（webchat）：网页实时查看/发送 QQ 单聊消息（迁移自 bison2）
# 访问 http://<host>:<port>/webchat/ ，用验证器 App 的 TOTP 动态码登录；
# totp_secret 留空则自动生成并持久到 data_dir，首次启用从启动日志或 /_stats 取
webchat:
  enabled: false
  totp_secret: ""            # Base32 密钥；留空自动生成（绑定验证器用）
  session_days: 7            # 登录会话令牌有效期（天）
  max_per_chat: 300          # 每会话内存保留条数
  persist: true              # jsonl 落盘（重启恢复最近历史）
  data_dir: "webchat"        # 落盘目录（相对运行目录）
